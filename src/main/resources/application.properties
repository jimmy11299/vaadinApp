server.port=${PORT:8090}
logging.level.org.atmosphere=warn

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true

# To improve the performance during development.
# For more information https://vaadin.com/docs/latest/flow/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,com.example
spring.application.admin.enabled=true


# PostgreSQL 連線設定（請替換成你的資料庫名稱、帳號、密碼）
spring.datasource.url=jdbc:postgresql://localhost:5432/vaadinPractise
spring.datasource.username=postgres
spring.datasource.password=871129

# JPA / Hibernate 設定：自動檢查並建立/更新表格結構
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect